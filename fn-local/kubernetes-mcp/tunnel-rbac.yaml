apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kubernetes-mcp-tunnel, namespace: infra-mcp-system}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [kubernetes-mcp]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, get]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kubernetes-mcp-tunnel, namespace: infra-mcp-system}
subjects:
  - {kind: User, apiGroup: rbac.authorization.k8s.io, name: fn-local-kubernetes-mcp-tunnel}
roleRef: {kind: Role, apiGroup: rbac.authorization.k8s.io, name: kubernetes-mcp-tunnel}
