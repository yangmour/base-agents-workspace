# Merge these blocks into your Codex config; do not replace existing settings.
# Install infra-mcp and make it available on the client PATH.

[mcp_servers.infra-redis]
command = "infra-mcp"
args = ["redis"]

[mcp_servers.infra-rabbitmq]
command = "infra-mcp"
args = ["rabbitmq"]

[mcp_servers.infra-elasticsearch]
command = "infra-mcp"
args = ["elasticsearch"]

[mcp_servers.infra-kubernetes]
command = "infra-mcp"
args = ["kubernetes"]

[mcp_servers.infra-nacos]
command = "infra-mcp"
args = ["nacos"]

[mcp_servers.infra-mysql]
command = "infra-mcp"
args = ["mysql"]

[mcp_servers.infra-rocketmq]
command = "infra-mcp"
args = ["rocketmq"]

[mcp_servers.infra-jenkins]
command = "infra-mcp"
args = ["jenkins"]
