[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "infra-mcp"
version = "0.1.0"
description = "Redis, RabbitMQ, Elasticsearch, Kubernetes, Nacos, MySQL, RocketMQ and Jenkins MCP servers with per-profile CRUD permissions"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "redis==7.4.1", "httpx>=0.27,<1", "PyMySQL[rsa]==1.2.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
infra-mcp = "infra_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/infra_mcp"]
